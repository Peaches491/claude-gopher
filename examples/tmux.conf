# claude-gopher tmux integration. Source from your tmux config:
#   source-file /path/to/claude-gopher/examples/tmux.conf

# Start the Gopher session and link its window at index 0 of whichever session a client attaches to.
# A fixed hook index keeps re-sourcing idempotent; a later plain `set-hook -g client-attached` clears it.
set-hook -g 'client-attached[90]' 'run-shell -b "gopher launch --session \"#{session_name}\" >/dev/null 2>&1 || true"'

# prefix g: toggle a popup attached to the gopher session (prefix g again inside it closes it).
# This replaces tmux 3.8's default prefix g (switch-client -T move, for floating panes).
# The window behind the popup is dimmed while it is open; the popup command restores it on close.
# run-shell expands the formats up front so the restore does not depend on the popup environment.
# While the popup is open, @gopher_popup_client names the outer client (so the TUI's jump can
# switch it and close the popup) and @gopher_popup_pane the pane it was opened from (so the TUI
# highlights that pane's project).
bind g {
  if -F '#{==:#{session_name},gopher}' { detach-client } {
    run-shell -b 'tmux set -w -t "#{window_id}" window-style dim=40; tmux set -g @gopher_popup_client "#{client_name}"; tmux set -g @gopher_popup_pane "#{pane_id}"; tmux display-popup -c "#{client_name}" -E -s bg=terminal -S bg=terminal -w 90% -h 90% "TMUX= tmux attach -t gopher; tmux -S #{socket_path} set -wu -t #{window_id} window-style; tmux -S #{socket_path} set -gu @gopher_popup_client; tmux -S #{socket_path} set -gu @gopher_popup_pane"'
  }
}
