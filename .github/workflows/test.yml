name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y tmux
        if: runner.os == 'Linux'
      - run: brew install tmux
        if: runner.os == 'macOS'
      - run: uv sync
      - run: uv run pytest -q
