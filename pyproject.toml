[project]
name = "claude-gopher"
version = "0.1.2"
description = "A secretary agent and project system for many concurrent Claude Code sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "textual>=1",
]

[project.optional-dependencies]
dev = ["watchfiles>=0.21"]

[project.scripts]
gopher = "claude_gopher.cli:main"

[dependency-groups]
dev = ["pytest>=8", "watchfiles>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_gopher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
